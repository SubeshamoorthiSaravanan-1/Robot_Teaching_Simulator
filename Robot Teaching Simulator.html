<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Teaching Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+Tamil:wght@400;600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e7e3;--panel:#f7f8f6;--ink:#1d2328;--mute:#5a656d;--line:#c3c9c4;--accent:#e0a800;--ok:#1f8a4c;--bad:#c62f2f;--hi:#2b3238;--hi-ink:#f2f4f1;--pend:#d9d3bd;--jog:#f4f1e4;--lcd:#b9d6a8;--lcdink:#16301a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b1e;--panel:#22282c;--ink:#eceeea;--mute:#9aa5ac;--line:#374045;--accent:#f2c200;--ok:#47c27a;--bad:#ff6b6b;--hi:#0f1315;--pend:#3a3d3e;--jog:#4a4f50;--lcd:#31472f;--lcdink:#c9f0b8}}
:root[data-theme="dark"]{--bg:#171b1e;--panel:#22282c;--ink:#eceeea;--mute:#9aa5ac;--line:#374045;--accent:#f2c200;--ok:#47c27a;--bad:#ff6b6b;--hi:#0f1315;--pend:#3a3d3e;--jog:#4a4f50;--lcd:#31472f;--lcdink:#c9f0b8}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.ta{font-family:"Noto Sans Tamil",Barlow,sans-serif;color:var(--mute);font-size:.9em}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
header{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;border-bottom:5px solid var(--accent)}
h1{font:700 25px/1 "Barlow Condensed",sans-serif;margin:0}
.stats{display:flex;gap:16px;font:600 14px "Barlow Condensed",sans-serif}.stats b{display:block;font-size:22px;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--ink);padding:8px 12px;border-radius:8px;font:600 15px Barlow,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
#banner{border-left:6px solid var(--accent);background:var(--panel);border-radius:8px;padding:8px 12px;margin-bottom:10px}
#banner b{font:700 18px "Barlow Condensed",sans-serif}
canvas{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.chk{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.chk li{display:flex;gap:8px;padding:4px 8px;border-radius:6px;color:var(--mute)}
.chk li.d{color:var(--ink)}.chk li.d i{color:var(--ok)}.chk li.c{background:var(--bg);color:var(--ink);font-weight:600}
.opbox{display:flex;gap:14px;align-items:center;justify-content:space-around;background:#8a9097;border-radius:10px;padding:12px;margin-bottom:12px;flex-wrap:wrap}
.opbox>div{text-align:center;font:600 12px Barlow,sans-serif;color:#111}
.es{width:62px;height:62px;border-radius:50%;border:6px solid #e8c200;background:#d62222;box-shadow:0 4px 0 #6d1010;cursor:pointer}
.es.on{box-shadow:none;transform:translateY(3px);background:#8e1515}
.sw{width:52px;height:52px;border-radius:50%;background:#15181a;border:3px solid #555;cursor:pointer;position:relative}
.sw::after{content:"";position:absolute;left:21px;top:3px;width:6px;height:24px;background:#ddd;border-radius:3px;transform-origin:50% 22px;transform:rotate(var(--r,-45deg));transition:transform .15s}
.btn{width:58px;height:44px;border-radius:8px;border:3px solid #333;cursor:pointer;font:700 11px Barlow;color:#111}
.g{background:#3a4a3f}.g.on{background:#38e06a}.cs{background:#4b6;}
.pend{background:var(--pend);border-radius:18px;padding:12px;border:2px solid var(--line)}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:600 12px Barlow}
.scr{background:var(--lcd);color:var(--lcdink);font:600 13px/1.35 ui-monospace,Menlo,monospace;border-radius:6px;padding:8px;min-height:176px;border:3px solid #555}
.scr .m{margin-top:6px;font-weight:700}.scr .m.bad{color:var(--bad)}
.scr button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--lcdink);color:var(--lcdink);margin:3px 0;padding:5px;font:inherit;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.k{background:var(--jog);color:var(--ink);border:1px solid #888;border-radius:6px;box-shadow:0 3px 0 #777;padding:10px 2px;font:700 13px Barlow;cursor:pointer;touch-action:none;user-select:none}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 #777}
.k.w2{grid-column:span 2}.k.w3{grid-column:span 3}
.fan .j{background:#2f6fd6;color:#fff;border-color:#1c4a98}
.pk{width:34px;height:34px;border-radius:50%;background:#15181a;border:3px solid #555;cursor:pointer;position:relative;display:inline-block;vertical-align:middle}
.pk::after{content:"";position:absolute;left:12px;top:2px;width:4px;height:14px;background:#ddd;transform-origin:50% 12px;transform:rotate(var(--r,-45deg))}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#ov div{background:var(--panel);border-radius:14px;padding:22px;text-align:center;max-width:380px}
.stars{font-size:38px;color:var(--accent);letter-spacing:6px}
.cta{background:var(--accent);color:#1d2328;border:0;border-radius:10px;padding:11px 20px;font:700 17px Barlow;cursor:pointer}
.row input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 15px Barlow,sans-serif;width:150px}
@media print{header,.row,.main{display:none}#ov{position:static;background:none;display:flex!important}#again,#pr{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Robot Teaching Simulator</h1><small>Elkayem Auto Ancillaries, Hosur Unit-II</small></div>
<div class="stats"><div><b id="sp">1/11</b>step</div><div><b id="sm">0</b>mistakes</div><div><b id="stt">0:00</b>time</div></div></header>
<div class="row">
<div class="seg" id="rb"><button data-r="0">Yaskawa-type</button><button data-r="1">Fanuc</button></div>
<div class="seg" id="gm"><button data-g="1">Guided</button><button data-g="0">Exam</button></div>
<div class="seg"><button id="rs">Restart</button></div><div class="seg" id="lv"><button data-l="0">Easy</button><button data-l="1">Hard 2:30</button></div><input id="nm" placeholder="Trainee name" maxlength="24"><input id="id" placeholder="Employee ID" maxlength="10" style="width:110px"></div>
<div class="main">
<section>
<div id="banner"></div>
<canvas id="cv" width="560" height="300" aria-label="Robot work cell, top view and side view"></canvas>
<ol class="chk" id="chk"></ol>
</section>
<section>
<div class="opbox"><div><button class="es" id="es" aria-label="Emergency stop"></button><br>E-STOP</div>
<div><button class="sw" id="op" aria-label="Mode key"></button><br><span id="opl">PLAYBACK</span></div>
<div><button class="btn g" id="mo">MOTOR ON</button><br>OPERATION BOX</div>
<div><button class="btn cs" id="cy">CYCLE START</button></div></div>
<div class="pend yas" id="pend">
<div class="ptop"><span>TEACH PENDANT</span><span>KEY <button class="pk" id="pk" aria-label="Pendant key"></button> <span id="pkl">OFF</span></span></div>
<div class="scr" id="scr"></div>
<div class="keys">
<button class="k w2" id="kStep"></button><button class="k" id="kDn"></button><button class="k" id="kUp"></button><button class="k w2" id="kProg"></button>
<button class="k j" data-j="x-">X−</button><button class="k j" data-j="x+">X+</button><button class="k j" data-j="y-">Y−</button><button class="k j" data-j="y+">Y+</button><button class="k j" data-j="z-">Z−</button><button class="k j" data-j="z+">Z+</button>
<button class="k w2" id="kFwd"></button><button class="k w2" id="kBwd"></button><button class="k w2" id="kMod"></button><button class="k w2" id="kRst">RESET</button>
</div></div>
</section></div></div>
<div id="ov"><div><div class="stars" id="stars"></div><h2 id="rt" style="margin:8px 0"></h2><p id="rd"></p><div id="lb" style="margin:10px 0;text-align:left"></div><button class="cta" id="again">Train again</button> <button class="cta" id="pr">Print sheet</button></div></div>
